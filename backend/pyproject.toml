[project]
name = "gstbot-backend"
version = "0.1.0"
description = "GSTIndia — AI GST compliance for Indian SMBs (FastAPI backend)"
requires-python = ">=3.11"
# Runtime dependencies are pinned in requirements.txt, which is what the
# deployment installs. Kept there rather than duplicated here so there is one
# place to change them.
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# No --cov here. Coverage slows the suite by roughly a third, and the number
# is only interesting in CI and when someone asks for it; `pytest --cov=app`
# picks up the settings below on demand.
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
# pytest-asyncio warns on every run while this is unset, and its default is
# changing; function scope is what the two async tests already assume.
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
# A gate rather than a target. It is set just under where the suite actually
# sits so that deleting tests, or adding a module with none, fails CI — not so
# that anyone writes a test purely to move it.
#
# The suite covers every statement and every branch today. The gate is still
# 99 rather than 100 deliberately: at 100 the next defensive guard someone
# writes fails CI on the commit that adds it, which pressures the author into
# either a test that asserts nothing or a pragma they have not thought about.
# A branch that genuinely cannot be reached is marked `# pragma: no branch`
# with the reason, and there are four — see alerting._existing,
# late_fee.turnover_tier, and the retry loops in email_sender and
# openrouter_client.
fail_under = 99
show_missing = true
skip_covered = true
exclude_also = [
    # Guards for code paths that only exist under a type checker.
    "if TYPE_CHECKING:",
    # Re-raise helpers and abstract stubs have no behaviour to assert on.
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
]

[tool.ruff]
line-length = 100
target-version = "py311"
# Migrations are generated by `alembic revision --autogenerate`; reformatting
# them by hand means the next autogenerate reintroduces every finding.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = [
    # `x: Type = Depends(...)` / `File(...)` is the FastAPI idiom for dependency
    # injection — the whole API surface would need noqa without this.
    "B008",
    # `class X(str, Enum)` is deliberate: members must compare equal to their
    # stored string for SQLAlchemy's non-native Enum columns and for Pydantic
    # serialization. StrEnum is not a drop-in replacement here.
    "UP042",
]

[tool.ruff.lint.per-file-ignores]
# The GSTR-2B fixtures are verbatim portal CSV: the heading row really is that
# wide, and wrapping it would stop testing the format the portal emits.
"tests/test_gstr2b.py" = ["E501"]
