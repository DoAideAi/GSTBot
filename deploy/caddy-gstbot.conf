# GSTBot edge configuration.
#
# This is a *site block*, not a complete Caddyfile. The edge on this host is a
# container (`knol-caddy`) shared with the other products on the box, and its
# configuration is one file: /opt/knol/Caddyfile, bind-mounted read-only from
# the host. Deploying this means appending the block below to that file and
# reloading:
#
#   docker exec knol-caddy caddy validate --config /etc/caddy/Caddyfile
#   docker exec knol-caddy caddy reload  --config /etc/caddy/Caddyfile
#
# `caddy reload` rather than a container restart: the other sites on that
# instance are serving, and a restart drops their connections to publish ours.
#
# Because the edge is containerised it cannot read the build output on the
# host, so both upstreams here are host processes on the Docker bridge gateway
# (172.18.0.1) — see deploy/systemd/gstbot-web.service for why that is a unit
# rather than a `file_server`.
#
# Certificates: Caddy obtains and renews for gst.doaide.com automatically.
# The ACME contact address is set once in the global block at the top of
# /opt/knol/Caddyfile and is not repeated here.

gst.doaide.com {
	log {
		output stdout
		format json
		level INFO
	}

	encode zstd gzip

	# Above the application's MAX_UPLOAD_MB=15 on purpose. The limit a user
	# should ever meet is the app's, which answers with a JSON error the UI
	# renders; this one exists so a multi-gigabyte body is dropped at the edge
	# rather than streamed into a Python process first.
	request_body {
		max_size 32MB
	}

	# ---- API ----
	# Deliberately no security headers on this handle: the application sets its
	# own and they are stricter than anything appropriate for a page (its CSP
	# is `default-src 'none'`). Setting them here would overwrite and loosen
	# them, because Caddy's `header` replaces rather than appends.
	@api path /api/*
	handle @api {
		reverse_proxy 172.18.0.1:3008 {
			# X-Forwarded-For, -Proto and -Host are set by Caddy already.
			# X-Real-IP is not, and the API's rate limiter reads it.
			header_up X-Real-IP {remote_host}

			# /live, not /ready: it never touches a dependency. There is one
			# upstream here, so a readiness-based check would only convert the
			# app's own "database is down" response into a bare 502 from the
			# edge, which is strictly less information.
			health_uri /api/v1/health/live
			health_interval 30s

			transport http {
				dial_timeout 10s
				# An upload whose parse falls back to inline processing is
				# waiting on a free-tier model call. The default 0 (no timeout)
				# would be worse: a hung upstream would pin the connection
				# forever.
				read_timeout 300s
				write_timeout 300s
			}

			# Exports stream; buffering them costs memory and time to first
			# byte. Caddy does not buffer by default — this is here so that
			# stays true if somebody adds a buffering directive later.
			flush_interval -1
		}
	}

	# No /docs handle. DOCS_ENABLED=false in production, so FastAPI does not
	# mount them and a route here would proxy to a 404. The OpenAPI schema
	# names every field of every tenant-scoped model; read it by running the
	# API locally.

	# ---- SPA ----
	handle {
		reverse_proxy 172.18.0.1:3009

		header {
			Strict-Transport-Security "max-age=31536000; includeSubDomains; preload"
			X-Content-Type-Options nosniff
			X-Frame-Options DENY
			Referrer-Policy strict-origin-when-cross-origin
			Cross-Origin-Opener-Policy same-origin
			Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()"
			# connect-src 'self' is what makes the same-origin arrangement
			# enforceable: a script that got onto the page still cannot post a
			# tenant's invoices anywhere else.
			#
			# style-src carries 'unsafe-inline' because several components set
			# a width or a height through the style attribute (the meters and
			# the dashboard bars, whose values are computed). script-src does
			# not, and must not: the build emits no inline script.
			#
			# The one hash is the inline service-worker registration index.html
			# carried until a863c71, and nothing else. Copies of that page still
			# open in browsers run it; allowed, it registers sw.js, which is now
			# a stub that clears its caches and unregisters. Safe to drop once
			# no old copies remain.
			#
			# Third-party origins, each for one named reason and nothing wider:
			# analytics.doaide.com (Umami), Google Fonts, and Razorpay Checkout —
			# its script, the iframe it opens, and the calls it makes from the
			# page. Without the Razorpay entries the browser blocks checkout.js
			# and every payment fails in the client, which is what the policy
			# did until P18 (and what the live site would do once keys exist).
			Content-Security-Policy "default-src 'self'; script-src 'self' https://analytics.doaide.com https://checkout.razorpay.com 'sha256-P3upB5nSJgaMZ66JypQ23kO70VzvIaT2MSedNexWFNk='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data:; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://analytics.doaide.com https://api.razorpay.com https://lumberjack.razorpay.com; frame-src https://api.razorpay.com https://checkout.razorpay.com; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; object-src 'none'"
			# Nothing downstream should be making decisions on the server
			# banner. Cache-Control is left to the upstream, which distinguishes
			# the fingerprinted assets from the entry HTML.
			-Server
		}
	}
}
