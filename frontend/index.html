    {

      "mainEntity": [
        {
          "@type": "Question",
          "name": "What is GST and who needs to file GST returns?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "GST is India's indirect tax on goods and services. Every registered business must file GSTR-1 and GSTR-3B. Registration is mandatory above ₹40 lakhs turnover for goods."
          }
        },
        {
          "@type": "Question",
          "name": "How does GSTR-2B reconciliation work?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "GSTR-2B lists your eligible ITC based on suppliers' filings. Reconciliation matches your purchase invoices against it. DoAide automates this so you claim the right amount."
          }
        },
        {
          "@type": "Question",
          "name": "What is Input Tax Credit (ITC) and how is it calculated?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "ITC lets you offset tax paid on purchases against your output liability. DoAide reconciles invoices with GSTR-2B and excludes blocked credits to calculate your eligible ITC."
          }
        },
        {
          "@type": "Question",
          "name": "Is DoAide GST really free?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. All features are included free for up to 50 invoices per month — no credit card required. Paid plans start at ₹499/month for higher volumes."
          }
        },
        {
          "@type": "Question",
          "name": "What are HSN codes and why do they matter for GST?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "HSN codes classify goods for tax purposes and determine the GST rate. Wrong codes cause tax and ITC mismatches. DoAide validates HSN codes on your invoices automatically."
          }
        },
        {
          "@type": "Question",
          "name": "What happens if I miss a GST filing deadline?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Late filing attracts ₹50/day penalty (capped at ₹5,000) plus 18% interest on unpaid tax. DoAide sends alerts before each deadline so you never miss one."
          }
        },
        {
          "@type": "Question",
          "name": "Can DoAide GST help with GST compliance for small businesses?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. DoAide handles invoices, GSTR-2B reconciliation, ITC calculation, and return prep — built for Indian SMBs. The free plan covers most small businesses."
          }
        }
      ]
