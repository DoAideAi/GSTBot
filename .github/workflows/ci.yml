name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A pull request's later push makes its earlier run irrelevant — only the
# latest commit merges — so those are grouped by branch and cancelled. A push to
# main is not: every commit there is a release. Grouped by branch, a run that
# takes twelve minutes was cancelled by the next push ten minutes later, 33 of
# 40 runs ended "cancelled", and twenty deployed commits went two hours with no
# verdict. Each push to main now gets its own group and runs to the end.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint + test)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Postgres is not needed by the test suite — that runs on in-memory SQLite
    # and owns its own configuration. It is here for the migration step below,
    # which is the only thing in CI that touches the database this app actually
    # deploys against.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gstbot
          POSTGRES_PASSWORD: gstbot
          POSTGRES_DB: gstbot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gstbot -d gstbot_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.lock
            backend/requirements-dev.txt

      - name: Install dependencies
        id: deps
        # The lock first, with its hashes, exactly as deploy.sh installs it, and
        # the test tools on top: the floors in requirements.txt are already met
        # by the locked versions, so nothing locked is moved. Installing the
        # floors alone resolved whatever PyPI had that day (SQLAlchemy 2.1 while
        # production ran 2.0), so the suite passed on versions no release ran.
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.lock
          pip install -r requirements-dev.txt

      - name: Lint
        # `tools` is included: it is not deployed, but it is the thing that
        # decides whether the suite's assertions are worth anything, and a
        # mutation tester nobody trusts is a mutation tester nobody runs.
        run: ruff check app tests tools

      # Deliberately no `ruff format --check`. The source is hand-formatted to
      # keep comment blocks and long call signatures readable, and ruff's
      # formatter disagrees with roughly every file. Lint enforces correctness;
      # layout is left alone.

      - name: Test
        # No env here on purpose: tests/conftest.py sets its own, pointing at
        # in-memory SQLite and an unreachable Redis so the degraded paths are
        # what run. It uses os.environ.setdefault, so anything exported here
        # would silently win and change what is under test.
        #
        # --cov-fail-under comes from pyproject. It is a ratchet against tests
        # being deleted or a module arriving with none, not a target to code
        # towards; raise it in the same commit that earns it.
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        # Kept even when the tests fail — a run that dropped below the gate is
        # exactly when someone wants to see which lines went uncovered.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: warn

      - name: Migrations apply to a real Postgres
        # Not hostage to the Test step. That step carries the coverage gate, and
        # a step after a failed one is skipped unless it says otherwise: every
        # run where coverage fell short skipped all three migration checks and
        # reported them as part of one red X that read as "coverage again". A
        # migration that did not apply would have been inside it, unseen.
        # `!cancelled()` rather than `always()`: nothing here can run on a job
        # whose dependencies never installed.
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        # `pytest` builds the schema with create_all against SQLite, so nothing
        # in the suite runs the migrations at all. This does, in both
        # directions: a downgrade that was never tried is a downgrade that does
        # not work, and it is only ever reached during an incident.
        env:
          DATABASE_URL: postgresql+psycopg://gstbot:gstbot@localhost:5432/gstbot_test
          JWT_SECRET: ci-only-secret-not-used-anywhere-else
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      - name: Migrations match the models
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        # Applying cleanly proves the migrations run, not that they produce the
        # schema the code expects. `alembic check` autogenerates against the
        # database built above and fails if anything differs — which is how a
        # column added to a model and never given a migration gets caught here
        # rather than as an UndefinedColumn in production.
        env:
          DATABASE_URL: postgresql+psycopg://gstbot:gstbot@localhost:5432/gstbot_test
          JWT_SECRET: ci-only-secret-not-used-anywhere-else
        run: alembic check

      - name: Rollbacks are exact, on the engine that ships
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        # The two steps above walk the chain down to base and back, where the
        # first migration drops every table wholesale — so a downgrade that
        # forgets a column it added still leaves an empty database and still
        # passes. tests/test_migrations.py asserts the property a rollback is
        # actually claiming: that going back one revision reproduces the schema
        # that revision's release ran on. It already ran in the suite above,
        # against a throwaway SQLite file; this runs it a second time against
        # the service, because `batch_alter_table` is exactly where the two
        # backends diverge — SQLite rebuilds the table, Postgres issues a real
        # ALTER, and only one of those is what a release does.
        #
        # Last in the job on purpose: the fixture wipes the shared database on
        # the way out, so anything ordered after this finds it empty.
        #
        # Only MIGRATION_TEST_DATABASE_URL, for the reason the Test step gives
        # — conftest.py sets the rest with setdefault, and exporting them here
        # would silently win.
        env:
          MIGRATION_TEST_DATABASE_URL: postgresql+psycopg://gstbot:gstbot@localhost:5432/gstbot_test
        run: pytest tests/test_migrations.py

  frontend:
    name: Frontend (test + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        id: deps
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        # Thresholds live in vite.config.js, the same ratchet the backend
        # keeps in pyproject.toml. `functions` is deliberately the loosest of
        # the four — see the comment there for why v8 undercounts it on JSX.
        run: npm run test:coverage

      - name: Upload coverage
        # Kept on failure too: a run that tripped the threshold is exactly
        # when someone wants to see which lines went uncovered.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/lcov.info
          if-no-files-found: warn

      - name: Build
        # Run whatever Test said, for the reason the backend's migration steps
        # give: a coverage shortfall used to skip the build and the budget.
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: npm run build

      - name: Bundle budget
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        # What a phone downloads before it shows anything. Budgets and why are
        # in the script; it prints the sizes either way.
        run: node scripts/check-bundle-budget.mjs dist

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Only worth the minutes once the code itself is known good.
    needs: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          load: true
          tags: gstbot-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          load: true
          tags: gstbot-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Compose file is valid
        run: docker compose config --quiet

  deploy:
    name: Deploy manifests (validate)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # No `needs:`. These files are checked by tools that never import the
    # application, so there is nothing for them to wait on — and a broken
    # Caddyfile is worth knowing about even in a run where the tests are red.

    steps:
      - uses: actions/checkout@v4

      # backend/tests/test_deploy.py asserts that these files agree with each
      # other and with the application: the port in the Caddyfile is the port
      # in the unit, the ExecStart lines address modules that import. What it
      # cannot do is parse them the way the server will. That is this job, and
      # it is the half that catches a missing brace — which otherwise surfaces
      # as `systemctl reload caddy` failing partway through a release.

      - name: Caddyfile is valid
        # The published image rather than an apt repository: `caddy validate`
        # is the only thing wanted from it, and the tag is the version the
        # server runs.
        run: |
          docker run --rm -v "$PWD/deploy/caddy-gstbot.conf:/etc/caddy/Caddyfile:ro" \
            caddy:2-alpine caddy validate --adapter caddyfile --config /etc/caddy/Caddyfile

      - name: Caddyfile is formatted
        # `validate` only warns about formatting, and it warns on every reload
        # — which is how the file ends up with a warning nobody reads attached
        # to it. Comparing against `caddy fmt` is the assertion that has teeth.
        run: |
          docker run --rm -v "$PWD/deploy/caddy-gstbot.conf:/etc/caddy/Caddyfile:ro" \
            caddy:2-alpine caddy fmt /etc/caddy/Caddyfile | diff -u deploy/caddy-gstbot.conf -

      - name: Units are valid
        # systemd-analyze runs the same parser the server does, which is the
        # only way to catch a misspelled directive — systemd ignores an unknown
        # key at runtime, so a typo in `ProtectSystem=` is a unit that reports
        # active and is not confined.
        #
        # The staging below exists because verify resolves User=,
        # EnvironmentFile= and ExecStart= against this filesystem. None of those
        # are what is under test here; test_deploy.py already checks the paths
        # themselves.
        #
        # The binaries are derived from the units rather than listed here. A
        # hardcoded list is how this step came to stub /srv/gstbot/venv while
        # the units had long since moved to /opt/GSTBot/.venv: every unit failed
        # to resolve, and the job reported that as a red X nobody could tell
        # apart from a real one. Reading ExecStart= means a new unit — or a
        # moved install root — cannot quietly stop being verified.
        run: |
          sudo useradd --system --no-create-home --shell /usr/sbin/nologin gstbot
          sudo install -d /etc/gstbot
          sudo touch /etc/gstbot/gstbot.env

          # The release, where the units say it is. This makes the shipped
          # scripts real executables at the paths that ship, so backup.sh and
          # monitor.sh are verified rather than stubbed over.
          sudo mkdir -p /opt/GSTBot
          sudo cp -R . /opt/GSTBot/

          # Everything else an Exec*= line names: the virtualenv that is built
          # at release time, and node from a distribution this runner is not.
          # Every Exec line, not only ExecStart=: gstbot-migrate's
          # ExecCondition= runs .venv/bin/python, which no ExecStart= names,
          # and verify refused the unit for it.
          for unit in deploy/systemd/*.service; do
            grep -q '^ExecStart=' "$unit" || { echo "no ExecStart= in $unit"; exit 1; }
            for binary in $(sed -n 's/^Exec[A-Za-z]*=[-@+!:|]*\([^ \\]*\).*/\1/p' "$unit"); do
              case "$binary" in /*) ;; *) continue ;; esac
              [ -x "$binary" ] && continue
              sudo install -d "$(dirname "$binary")"
              sudo install -m 0755 /dev/null "$binary"
            done
          done

          systemd-analyze verify deploy/systemd/gstbot.target deploy/systemd/*.service deploy/systemd/*.timer

      - name: Release scripts are sound
        # The suite runs `bash -n`, which only proves they parse. shellcheck is
        # what catches the unquoted expansion and the swallowed exit status —
        # the failures a release script has in the one situation it exists for,
        # and a backup script has at 02:30 with nobody watching.
        run: shellcheck deploy/deploy.sh deploy/backup.sh deploy/monitor.sh deploy/rollback-frontend.sh
