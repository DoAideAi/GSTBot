# Automated dependency updates.
#
# Both halves ship exact pins: `backend/requirements.lock` and
# `frontend/package-lock.json`. Nothing moves until somebody moves it, and an
# advisory against a locked version sits there indefinitely.
#
# On the backend this only raises the floors in `requirements.txt`. It cannot
# re-lock (the lock is uv-compiled), so its pull requests stay red in
# tests/test_requirements.py until someone re-locks them with the command in the
# lock's header. That is deliberate: a merged floor the lock doesn't meet would
# ship nothing. It also never sees a transitive pin. That is what
# workflows/audit.yml is for: it audits the lock itself, weekly.
#
# Both failure modes are the same thing from CI's point of view: nobody is
# looking. A pull request per update puts the change in front of the full suite
# — backend tests, frontend tests, both images, and the migration round-trip —
# which is the only place a dependency bump gets to prove itself.
#
# Deliberately not a CI gate. An advisory can be published against code nobody
# touched, and a check that turns unrelated pull requests red teaches people to
# merge past it. GitHub's advisory surface reports; this raises the fix.
version: 2

updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # One pull request for the routine noise, individual ones for anything
    # that can plausibly break at runtime. A grouped patch bump that fails CI
    # is still readable; a grouped major bump is a bisect.
    groups:
      backend-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: "deps(backend)"

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      frontend-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: "deps(frontend)"

  # The base images carry far more code than either requirements file, and it
  # is the half nothing else here watches: `python:3.12-slim` and
  # `nginx:1.27-alpine` are moving tags, so the CVE count in a deployed image
  # is a function of when it was last built.
  - package-ecosystem: docker
    directories: ["/backend", "/frontend"]
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "deps(docker)"

  # Actions run with a token against this repository. Pinned to major tags
  # (`actions/checkout@v4`), which float, so this mostly catches the majors —
  # the ones that would otherwise be found when a runner image drops support.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci"
